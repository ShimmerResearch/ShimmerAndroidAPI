def getArtificatId = { ->
    return "ShimmerAndroidInstrumentDriver" // Replace with library name ID
}
// Published by the "Release Android API" workflow (.github/workflows/release.yml), which picks the
// version and passes it as -PreleaseVersion; the AndroidAPI_v tags record what was released. Run
// assembleRelease before publish, because the artifact is the built .aar file.
publishing {
    publications {
        bar(MavenPublication) {
            groupId = 'com.shimmerresearch' // Replace with your package's group/organization name
            artifactId = 'shimmerandroidinstrumentdriver' // Replace with the name of your package
            version = project.findProperty('releaseVersion') ?: 'local' // set by the Release Android API workflow
            artifact("$buildDir/outputs/aar/${getArtificatId()}-release.aar")
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ShimmerResearch/ShimmerAndroidAPI")
            credentials {
                // Locally: gpr.user and gpr.key in GRADLE_USER_HOME/gradle.properties, with a token
                // that has write:packages. In the workflow: GITHUB_ACTOR and GITHUB_TOKEN. These are
                // kept apart from USERNAME/TOKEN in the root build.gradle, which only need to read.
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
// Without -PreleaseVersion the version is 'local', and GitHub Packages never lets a version be
// overwritten. Releases go through the Release Android API workflow; publishToMavenLocal is unaffected.
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (publication.version == 'local') {
            throw new GradleException("Refusing to publish ${publication.artifactId} as version 'local'. " +
                "Release with the Release Android API workflow, or pass -PreleaseVersion.")
        }
    }
}
dependencies {
    implementation 'com.google.guava:guava:20.0'
    implementation 'java3d:vecmath:1.3.1'
    implementation files('libs/ShimmerBiophysicalProcessingLibrary_Rev_0_11.jar')
    implementation files('libs/AndroidBluetoothLibrary.jar')
    api files('libs/androidplot-core-0.5.0-release.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.Jasonchenlijian:FastBle:2.4.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
