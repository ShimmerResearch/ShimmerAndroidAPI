// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        //classpath 'com.android.tools.build:gradle:3.5.4'
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.5'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        //classpath('org.jfrog.buildinfo:build-info-extractor-gradle:4.21.0')
    }
}
// Plugin used to upload authenticated files to BinTray through Gradle
/*plugins {
    id "com.jfrog.artifactory" version "4.21.0"
}
apply plugin: 'com.jfrog.artifactory'
*/
apply plugin: 'maven-publish'

// The shimmerdriver / shimmerbluetoothmanager version (Shimmer-Java-Android-API) that the library and
// every example build against. The default is what master builds with; the Release Android API
// workflow passes -PdriverVersion, by default the newest Java API release.
def shimmerDriverVersion = findProperty('driverVersion') ?: '0.11.12_beta'

allprojects {
    repositories {
        google()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ShimmerResearch/Shimmer-Java-Android-API")
            credentials {
                /* Create gradle.properties file in GRADLE_USER_HOME/.gradle/ 
                (e.g. C:/Users/YourUsername/.gradle/) with the two lines listed below. Fill in your 
                Github ID and personal access token - as generated through the Github Developer 
                Settings page. The token needs to have "read:packages" scope enabled on it: 
                    gpr.usr=GITHUB_USER_ID 
                    gpr.key=PERSONAL_ACCESS_TOKEN 
                */
                username = project.findProperty("gpr.usr") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
                /* should the above not work key in your username and password directly e.g.
                  username = "username"
                  password = "password"
                DO NOT commit your username and password
                */
            }
        }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ShimmerResearch/ShimmerAndroidAPI")
            credentials {
                /* Create gradle.properties file in GRADLE_USER_HOME/.gradle/ 
                (e.g. C:/Users/YourUsername/.gradle/) with the two lines listed below. Fill in your 
                Github ID and personal access token - as generated through the Github Developer 
                Settings page. The token needs to have "read:packages" scope enabled on it: 
                    gpr.usr=GITHUB_USER_ID 
                    gpr.key=PERSONAL_ACCESS_TOKEN 
                */
                username = project.findProperty("gpr.usr") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
                /* should the above not work key in your username and password directly e.g.
                  username = "username"
                  password = "password"
                DO NOT commit your username and password
                */
            }
        }
        mavenCentral()
        mavenLocal()
        jcenter()
        maven { url 'https://jitpack.io' }
    }
    subprojects {
        afterEvaluate {
            dependencies {
                implementation 'com.google.guava:guava:20.0'
                implementation 'java3d:vecmath:1.3.1'
                implementation 'androidx.appcompat:appcompat:1.7.0'
                implementation 'com.github.Jasonchenlijian:FastBle:2.4.0'
                implementation (group: 'com.shimmerresearch', name: 'shimmerbluetoothmanager', version: shimmerDriverVersion){

                    // excluding org.json which is provided by Android
                    exclude group: 'io.netty'
                    exclude group: 'com.google.protobuf'
                    // JNA (in the driver since 0.11.8_beta) is for the desktop USB debug listeners only; on
                    // Android its two jars clash on META-INF/AL2.0 and fail every app's packaging.
                    exclude group: 'net.java.dev.jna'
                    exclude group: 'org.apache.commons.math'
                }

                implementation (group: 'com.shimmerresearch', name: 'shimmerdriver', version: shimmerDriverVersion){

                    // excluding org.json which is provided by Android
                    exclude group: 'io.netty'
                    exclude group: 'com.google.protobuf'
                    // JNA (in the driver since 0.11.8_beta) is for the desktop USB debug listeners only; on
                    // Android its two jars clash on META-INF/AL2.0 and fail every app's packaging.
                    exclude group: 'net.java.dev.jna'
                }
            }
        }
    }

